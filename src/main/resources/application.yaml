spring:
  ai:
    openai:
      api-key: "${OPENAI_API_KEY:REMOVED_OPENAI_KEY}"
    model:
      chat: openai
    mcp:
      server:
        protocol: STREAMABLE
        name: agent-studio-editor
        version: 1.0.0
        type: SYNC
        instructions: "MCP server for the Agent Studio visual editor. Provides tools to create, modify, and inspect AI agent graphs consisting of agents, tools, sub-agents, MCP servers, and planner agents."
        streamable-http:
          mcp-endpoint: /mcp
  application:
    name: modeler

koog:
  spring:
    ai:
      chat:
        enabled: true
        dispatcher:
          type: AUTO
